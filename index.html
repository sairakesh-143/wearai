const timeAgo = (d) => {
  const diff = Date.now()-new Date(d).getTime();
  const min = Math.floor(diff/60000);
  if(min<1) return 'just now';
  if(min<60) return `${min}m ago`;
  const hr = Math.floor(min/60);
  if(hr<24) return `${hr}h ago`;
  return `${Math.floor(hr/24)}d ago`;
};

function showToast(type,msg){
  const colors = {success:'bg-emerald-600 border-emerald-500',error:'bg-rose-600 border-rose-500',warning:'bg-amber-600 border-amber-500',info:'bg-brand-600 border-brand-500'};
  const icons = {success:'check-circle-2',error:'alert-octagon',warning:'alert-triangle',info:'info'};
  const id = 'toast-'+Date.now();
  const html = `
    <div id="${id}" class="toast-enter ${colors[type]} border text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 min-w-[320px] max-w-md backdrop-blur-md">
      <i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i>
      <span class="text-xs font-semibold flex-1 leading-snug">${esc(msg)}</span>
      <button onclick="document.getElementById('${id}').remove()" class="opacity-70 hover:opacity-100 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
    </div>`;
  document.getElementById('toast-container').insertAdjacentHTML('beforeend',html);
  lucide.createIcons();
  setTimeout(()=>{ const el=document.getElementById(id); if(el) el.remove(); },4000);
}

function badge(text,color){
  const colors = {
    green:'bg-emerald-50 text-emerald-700 border-emerald-200',
    red:'bg-rose-50 text-rose-700 border-rose-200',
    amber:'bg-amber-50 text-amber-700 border-amber-200',
    blue:'bg-brand-50 text-brand-700 border-brand-200',
    purple:'bg-blue-50 text-blue-800 border-blue-200',
    gray:'bg-slate-100 text-slate-700 border-slate-200'
  };
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${colors[color]||colors.gray}">${esc(text)}</span>`;
}

function priorityBadge(p){
  const map = {Critical:'red',High:'amber',Medium:'blue',Low:'gray'};
  const dot = {Critical:'bg-rose-500',High:'bg-amber-500',Medium:'bg-brand-500',Low:'bg-slate-400'};
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ${map[p]==='red'?'bg-rose-50 text-rose-700 border border-rose-200':map[p]==='amber'?'bg-amber-50 text-amber-700 border border-amber-200':map[p]==='blue'?'bg-brand-50 text-brand-700 border border-brand-200':'bg-slate-100 text-slate-700 border border-slate-200'}">
    <span class="w-1.5 h-1.5 rounded-full ${dot[p]} ${p==='Critical'?'pulse-dot':''}"></span>${p}</span>`;
}

function statusBadge(s){
  const map = {
    'New':'gray','Confirmed':'blue','Allocated':'blue','Partially Allocated':'amber',
    'Picking':'purple','Picked':'blue','Packing':'purple','Quality Check':'amber',
    'Ready for Dispatch':'green','Dispatched':'green','Delivered':'green',
    'In Stock':'green','Low Stock':'amber','Critical Stock':'red','Out of Stock':'red',
    'Reserved':'blue','Damaged':'red','Open':'red','Investigating':'amber','Resolved':'green','Closed':'gray'
  };
  return badge(s, map[s]||'gray');
}

// ==================== ENGINE LOGIC ====================
function calcPriority(order){
  let score = 0;
  const reasons = [];
  const hrsLeft = hoursUntil(order.deadline);
  if(hrsLeft < 0){ score += 40; reasons.push('Past deadline'); }
  else if(hrsLeft < 4){ score += 35; reasons.push(`Deadline in ${hrsLeft}h`); }
  else if(hrsLeft < 24){ score += 20; reasons.push(`Deadline in ${Math.floor(hrsLeft)}h`); }
  else if(hrsLeft < 72){ score += 10; reasons.push(`Deadline in ${Math.floor(hrsLeft/24)}d`); }

  if(order.customerTier === 'VIP'){ score += 25; reasons.push('VIP Tier'); }
  else if(order.customerTier === 'Premium'){ score += 15; reasons.push('Premium Tier'); }

  if(order.shipMethod === 'Express' || order.shipMethod === 'Same-Day'){ score += 15; reasons.push(`${order.shipMethod} shipping`); }
  if(order.total > 500){ score += 10; reasons.push('High value'); }
  if(order.exceptionStatus !== 'None'){ score += 15; reasons.push(`Exception: ${order.exceptionStatus}`); }

  let priority = 'Low';
  if(score >= 70) priority = 'Critical';
  else if(score >= 50) priority = 'High';
  else if(score >= 25) priority = 'Medium';

  return { priority, score, reasons };
}

function checkAllocationConflict(sku){
  const product = PRODUCTS.find(p=>p.sku===sku);
  if(!product) return null;
  const competing = ORDERS.filter(o=>o.status==='New'||o.status==='Confirmed')
    .filter(o=>o.items.some(it=>it.sku===sku));
  if(competing.length === 0) return null;
  const totalDemand = competing.reduce((s,o)=>s+(o.items.find(it=>it.sku===sku)?.qty||0),0);
  if(totalDemand <= product.stock) return null;
  competing.forEach(o=>{ o._priority = calcPriority(o); });
  competing.sort((a,b)=>b._priority.score - a._priority.score);
  return { sku, product, competing, available: product.stock, totalDemand, shortfall: totalDemand - product.stock };
}

function resolveAllocation(sku){
  const conflict = checkAllocationConflict(sku);
  if(!conflict) return null;
  let remaining = conflict.available;
  const decisions = [];
  for(const order of conflict.competing){
    const need = order.items.find(it=>it.sku===sku)?.qty || 0;
    const allocated = Math.min(need, remaining);
    remaining -= allocated;
    decisions.push({
      orderId: order.id, priority: order._priority.priority, score: order._priority.score,
      requested: need, allocated, remaining: need - allocated,
      fullyAllocated: allocated === need, customer: order.customer, customerTier: order.customerTier,
      reasons: order._priority.reasons
    });
  }
  return { ...conflict, decisions, recommendation: decisions[0].allocated > 0 ?
    `Allocate ${decisions[0].allocated} units to ${decisions[0].orderId} (${decisions[0].priority} priority — ${decisions[0].reasons.join(', ')})` : 'No stock available' };
}

function detectLowStock(){
  return PRODUCTS.filter(p=>p.stock <= p.reorderLevel).map(p=>{
    const daysRemaining = p.stock > 0 ? (p.stock / p.dailyDemand).toFixed(1) : 0;
    let risk = 'Low';
    if(p.stock === 0) risk = 'Critical';
    else if(parseFloat(daysRemaining) < 2) risk = 'High';
    else if(parseFloat(daysRemaining) < 5) risk = 'Medium';
    return { ...p, daysRemaining, risk };
  }).sort((a,b)=>parseFloat(a.daysRemaining)-parseFloat(b.daysRemaining));
}

function optimizeRoute(order){
  const items = [...order.items].sort((a,b)=>{
    if(a.zone!==b.zone) return a.zone.localeCompare(b.zone);
    if(a.shelf!==b.shelf) return a.shelf - b.shelf;
    return a.rack - b.rack;
  });
  const dist = items.reduce((d,it,i)=>{
    if(i===0) return 20;
    const prev = items[i-1];
    const zDiff = Math.abs(prev.zone.charCodeAt(0)-it.zone.charCodeAt(0))*40;
    const sDiff = Math.abs(prev.shelf-it.shelf)*10;
    return d + zDiff + sDiff + 15;
  },0);
  return { items, distance: dist, time: Math.ceil(dist/15), efficiency: Math.min(98, Math.max(75, 100 - items.length*2)) };
}

function getSmartDecisions(){
  const recs = [];
  const conflict = resolveAllocation('SKU-101');
  if(conflict && conflict.shortfall > 0){
    recs.push({
      id:'rec-alloc-1', type:'Stock Allocation', icon:'git-branch', color:'blue',
      problem:`Stock contention on SKU-101 — ${conflict.totalDemand} units demanded, only ${conflict.available} available in Zone A`,
      data:`ORD-1001 (${conflict.competing[0]._priority.priority}) needs ${conflict.competing[0].items.find(i=>i.sku==='SKU-101').qty} | ORD-1002 (${conflict.competing[1]._priority.priority}) needs ${conflict.competing[1].items.find(i=>i.sku==='SKU-101').qty}`,
      decision:`Allocate ${conflict.decisions[0].allocated} units to ${conflict.decisions[0].orderId} (Critical priority). Mark as Partially Allocated.`,
      impact:`Critical VIP order partially fulfilled. Exception ticket auto-created. Reorder batch triggered.`,
      action:'Apply AI Allocation', actionType:'allocate', actionData:{conflict}
    });
  }
  return recs;
}

function addFeedEvent(){
  const pool = [
    'Order {ORD} assigned to picking route in Zone {ZONE}',
    'Order {ORD} completed picking with 100% barcode match',
    'Station 2 completed packing for order {ORD}',
    'Quality control passed for order {ORD}',
    'SKU-{SKU} stock levels dipped below safety threshold',
    'Carrier scan registered for order {ORD}'
  ];
  const template = pool[Math.floor(Math.random()*pool.length)];
  const ordNum = 1000 + Math.floor(Math.random()*30);
  const skuNum = 101 + Math.floor(Math.random()*40);
  const zone = ['A','B','C','D'][Math.floor(Math.random()*4)];
  const msg = template.replace('{ORD}',`ORD-${ordNum}`).replace('{SKU}',String(skuNum).padStart(3,'0')).replace('{ZONE}',zone);
  state.feed.unshift({type:'info',message:msg,time:new Date()});
  if(state.feed.length > 20) state.feed.pop();
}

function addActivityLog(user,action,target,prev,next){
  state.activityLog.unshift({user,action,target,time:new Date(),prev,next});
  if(state.activityLog.length > 50) state.activityLog.pop();
}

    if(state.filters.status!=='all' && o.status!==state.filters.status) return false;

  return `

const actions = {
  login(){ actions.quickLogin('admin'); },
  quickLogin(role){
    const user = EMPLOYEES.find(e=>e.role===role) || EMPLOYEES[0];
    state.user = user;
    state.view = 'dashboard';
    showToast('success',`Welcome back, ${user.name}!`);
    addActivityLog(user.name,'Logged in to console','System','-','Active');
    render();
  },
  logout(){
    state.user = null;
    state.view = 'login';
    destroyCharts();
    render();
  },
  toggleMobileMenu(){
    state.mobileMenuOpen = !state.mobileMenuOpen;
    render();
  },
  toggleWarehouseDropdown(){
    state.whDropdownOpen = !state.whDropdownOpen;
    state.notifDropdownOpen = false;
    state.userDropdownOpen = false;
    render();
  },
  setWarehouse(name){
    state.warehouse = name;
    state.whDropdownOpen = false;
    showToast('info',`Switched facility context to ${name}`);
    render();
  },
  toggleNotifDropdown(){
    state.notifDropdownOpen = !state.notifDropdownOpen;
    state.whDropdownOpen = false;
    state.userDropdownOpen = false;
    render();
  },
  toggleUserDropdown(){
    state.userDropdownOpen = !state.userDropdownOpen;
    state.whDropdownOpen = false;
    state.notifDropdownOpen = false;
    render();
  },
  markAllRead(){
    state.notifications.forEach(n=>n.read=true);
    showToast('success','All notifications marked as read');
    render();
  },

  submitNewOrder(){
    const [custName, custTier] = document.getElementById('new-cust').value.split('|');
    const [sku, name, price, zone, shelf, rack, bin] = document.getElementById('new-sku').value.split('|');
    const qty = parseInt(document.getElementById('new-qty').value) || 1;
    const shipMethod = document.getElementById('new-ship').value;

    const newId = `ORD-${1000 + ORDERS.length + 1}`;
    ORDERS.unshift({
      id: newId, customer: custName, customerTier: custTier,
      items: [{sku, name, qty, price: parseFloat(price), zone, shelf: parseInt(shelf), rack: parseInt(rack), bin: parseInt(bin)}],
      total: parseFloat(price) * qty,
      date: new Date(),
      deadline: new Date(Date.now() + 4 * 3600000),
      shipMethod, warehouse: 'WH-01', status: 'New', picker: null, packer: null,
      exceptionStatus: 'None', createdAt: new Date()
    });
    closeModal();
    showToast('success', `Created priority order ${newId} for ${custName}!`);
    addActivityLog(state.user.name, 'created priority order', newId, '-', 'New');
    render();
  },
  openAiOptimizerModal(){
    showModal(`
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-brand-50 flex items-center justify-center text-brand-600">
              <i data-lucide="zap" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="text-base font-bold text-slate-900 font-display">WearAI Logistics Optimizer</h3>
              <p class="text-xs text-slate-500">Autonomous resolution of inventory constraints & warehouse routing</p>
            </div>
          </div>
          <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-2 mb-4">
          <div class="flex items-center justify-between">
            <span class="text-slate-600">Pending Orders Scanned:</span>
            <span class="font-bold text-slate-900">${ORDERS.length}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-600">Active Conflicts Identified:</span>
            <span class="font-bold text-rose-600">1 (SKU-101)</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-600">Aisle Path Optimization:</span>
            <span class="font-bold text-brand-600">35% Travel Time Reduction</span>
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700">Cancel</button>
          <button onclick="actions.applyAllocation('SKU-101');closeModal();" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-sm">
            Execute All AI Recommendations →
          </button>
        </div>
      </div>
    `);
  },
  applyAllocation(sku){
    const result = resolveAllocation(sku);
    if(!result) return;
    result.decisions.forEach(d=>{
      const order = ORDERS.find(o=>o.id===d.orderId);
      if(order){
        order.status = d.fullyAllocated ? 'Allocated' : 'Partially Allocated';
        const product = PRODUCTS.find(p=>p.sku===sku);
        if(product){
          product.stock -= d.allocated;
          product.reserved += d.allocated;
        }
      }
    });
    showToast('success',`WearAI allocated ${result.decisions[0].allocated} units of ${sku} to ${result.decisions[0].orderId}`);
    addActivityLog(state.user.name,`allocated ${result.decisions[0].allocated} units of ${sku} to`,result.decisions[0].orderId,'New','Allocated');
    render();
  },
  overrideAllocation(sku){
    showModal(`
      <div class="p-6">
        <h3 class="text-base font-bold text-slate-900 mb-3">Manual Allocation Override</h3>
        <div class="space-y-2 text-xs mb-4">
          <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="ov" checked class="text-brand-600"/>
            <span>Allocate all 7 units to ORD-1001 (Critical VIP)</span>
          </label>
          <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50">
            <input type="radio" name="ov" class="text-brand-600"/>
            <span>Split stock equally (3 to ORD-1001, 4 to ORD-1002)</span>
          </label>
        </div>
        <div class="flex justify-end gap-2">
          <button onclick="closeModal()" class="px-4 py-2 border rounded-xl text-xs">Cancel</button>
          <button onclick="closeModal();showToast('info','Override applied');render()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold">Apply</button>
        </div>
      </div>
    `);
  },
  viewOrder(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    const pri = calcPriority(order);
    showModal(`
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-base font-bold text-slate-900 font-mono">${order.id}</h3>
            <p class="text-xs text-slate-500">${order.customer} (${order.customerTier} Tier)</p>
          </div>
          <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="grid grid-cols-2 gap-3 text-xs mb-4">
          <div class="p-3 bg-slate-50 rounded-xl">Status: <div class="mt-1">${statusBadge(order.status)}</div></div>
          <div class="p-3 bg-slate-50 rounded-xl">Priority: <div class="mt-1">${priorityBadge(pri.priority)}</div></div>
        </div>
        <div class="space-y-2 text-xs">
          <p class="font-bold text-slate-800">Order Items:</p>
          ${order.items.map(it=>`
            <div class="flex justify-between p-2 rounded-lg bg-slate-50 border border-slate-200">
              <span>${it.name} (${it.sku})</span>
              <span class="font-bold font-mono">${it.qty} × ${fmtCur(it.price)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `);
  },
  triggerReorder(sku, qty){
    const p = PRODUCTS.find(prod=>prod.sku===sku);
    if(!p) return;
    p.stock += qty;
    p.status = 'In Stock';
    showToast('success', `Placed order for ${qty} units of ${p.name} from ${p.supplier}`);
    addActivityLog(state.user.name, 'placed reorder for', `${sku} (${qty} units)`, 'Critical Stock', 'In Stock');
    render();
  },
  startPicking(id){
    const o = ORDERS.find(ord=>ord.id===id);
    if(o){ o.status = 'Picking'; o.picker = state.user.name; showToast('info',`Started picking ${id}`); render(); }
  },
  completePicking(id){
    const o = ORDERS.find(ord=>ord.id===id);
    if(o){ o.status = 'Picked'; showToast('success',`Completed pick for ${id}`); render(); }
  },
  completePacking(id){
    const o = ORDERS.find(ord=>ord.id===id);
    if(o){ o.status = 'Quality Check'; showToast('success',`Order ${id} packed and queued for QC`); render(); }
  },
  passQC(id){
    const o = ORDERS.find(ord=>ord.id===id);
    if(o){ o.status = 'Ready for Dispatch'; showToast('success',`Order ${id} passed QC`); render(); }
  },
  failQC(id){
    const o = ORDERS.find(ord=>ord.id===id);
    if(o){
      o.status = 'Quality Check';
      o.exceptionStatus = 'Quality Check Failure';
      EXCEPTIONS.unshift({
        id:`EX-${100+EXCEPTIONS.length+1}`,type:'Quality Check Failure',order:id,sku:'Multiple',severity:'Critical',status:'Open',created:new Date(),
        assigned:state.user.name,recommendation:'Inspect packaging damage. Replace damaged unit from Zone A.'
      });
      showToast('error',`Order ${id} failed QC — exception created`);
      render();
    }
  },
  dispatch(id){
    const o = ORDERS.find(ord=>ord.id===id);
    if(o){ o.status = 'Dispatched'; showToast('success',`Order ${id} dispatched via ${o.shipMethod}`); render(); }
  },
  resolveException(id){
    const e = EXCEPTIONS.find(ex=>ex.id===id);
    if(e){ e.status = 'Resolved'; showToast('success',`Exception ${id} marked as resolved`); render(); }
  }
};

// ==================== CHARTS INITIALIZATION ====================
function renderCharts(){
  if(state.view === 'dashboard'){
    const statusCtx = document.getElementById('chartOrderStatus');
    if(statusCtx){
      const statusCounts = {};
      ORDER_STATUSES.forEach(s=>statusCounts[s]=0);
      ORDERS.forEach(o=>statusCounts[o.status]=(statusCounts[o.status]||0)+1);
      charts.status = new Chart(statusCtx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(statusCounts),
          datasets: [{
            data: Object.values(statusCounts),
            backgroundColor: ['#94a3b8','#2563eb','#1d4ed8','#f59e0b','#3b82f6','#0284c7','#06b6d4','#f97316','#10b981','#059669','#047857'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10, family: 'Plus Jakarta Sans' } } } }
        }
      });
    }

    const priCtx = document.getElementById('chartPriority');
    if(priCtx){
      const priCounts = { Critical: 0, High: 0, Medium: 0, Low: 0 };
      ORDERS.forEach(o=>priCounts[calcPriority(o).priority]++);
      charts.priority = new Chart(priCtx, {
        type: 'bar',
        data: {
          labels: ['Critical', 'High', 'Medium', 'Low'],
          datasets: [{
            data: Object.values(priCounts),
            backgroundColor: ['#e11d48','#f59e0b','#2563eb','#94a3b8'],
            borderRadius: 8,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
            x: { grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } }
          }
        }
      });
    }

    const fulCtx = document.getElementById('chartFulfillment');
    if(fulCtx){
      charts.fulfillment = new Chart(fulCtx, {
        type: 'line',
        data: {
          labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
          datasets: [
            { label: 'Fulfilled %', data: [88, 91, 89, 94, 96, 92, 95], borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.08)', fill: true, tension: 0.4 },
            { label: 'Target %', data: [90, 90, 90, 90, 90, 90, 90], borderColor: '#000000', borderDash: [4, 4], fill: false, tension: 0 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { min: 70, max: 100, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
            x: { grid: { display: false }, ticks: { font: { size: 10 } } }
          }
        }
      });
    }
  }

  if(state.view === 'analytics'){
    const ptCtx = document.getElementById('chartProcessingTime');
    if(ptCtx){
      charts.pt = new Chart(ptCtx, {
        type: 'bar',
        data: {
          labels: ['Picking', 'Packing', 'QC', 'Dispatch'],
          datasets: [
            { label: 'Actual Time (min)', data: [12, 8, 4, 18], backgroundColor: '#2563eb', borderRadius: 6 },
            { label: 'SLA Target (min)', data: [10, 6, 3, 15], backgroundColor: '#bfdbfe', borderRadius: 6 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
      });
    }
    const perfCtx = document.getElementById('chartPerformance');
    if(perfCtx){
      charts.perf = new Chart(perfCtx, {
        type: 'line',
        data: {
          labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
          datasets: [
            { label: 'Accuracy %', data: [98.2, 99.1, 98.8, 99.4, 99.7, 99.2, 99.8], borderColor: '#2563eb', tension: 0.4 },
            { label: 'On-Time %', data: [91, 94, 92, 96, 97, 95, 98], borderColor: '#000000', tension: 0.4 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 85, max: 100 } } }
      });
    }
  }
}

// ==================== ROUTER & RENDER ====================
function navigate(view){
  state.view = view;
  render();
}

function render(){
  destroyCharts();
  if(!state.user){
    document.getElementById('app').innerHTML = renderLogin();
    lucide.createIcons();
    return;
  }

  const views = {
    dashboard: renderDashboard,
    orders: renderOrders,
    inventory: renderInventory,
    allocation: renderAllocation,
    picking: renderPicking,
    packing: renderPacking,
    qualityCheck: renderQualityCheck,
    dispatch: renderDispatch,
    exceptions: renderExceptions,
    analytics: renderAnalytics,
    smartDecisions: renderSmartDecisions,
    notifications: renderNotifications,
    settings: renderSettings
  };

  const viewFn = views[state.view] || renderDashboard;
  document.getElementById('app').innerHTML = `
    <div class="min-h-screen flex flex-col bg-slate-50">
      ${renderTopbar()}
      <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        ${viewFn()}
      </main>
      <footer class="border-t border-slate-200 bg-white py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
          <p>© 2026 <strong class="text-slate-800">WearAI Platform</strong> — Developed & Managed by <strong class="text-brand-600">Sai Rakesh</strong></p>
          <div class="flex items-center gap-4">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 99.8% System Uptime</span>
            <a href="https://github.com/sairakesh-143/wearai" target="_blank" class="hover:text-brand-600 font-bold">GitHub Repo</a>
          </div>
        </div>
      </footer>
    </div>
  `;
  lucide.createIcons();
  setTimeout(renderCharts, 50);
}

// ==================== INIT ====================
render();
setInterval(addFeedEvent, 15000);
