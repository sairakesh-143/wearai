function genOrders(){
  const orders = [];

    exceptionStatus:'None', createdAt:new Date(Date.now()-5*3600000)
  });

  for(let i=3;i<=30;i++){
    const cust = CUSTOMERS[Math.floor(Math.random()*CUSTOMERS.length)];
    const itemCount = Math.floor(Math.random()*4)+1;
    const items = [];
    for(let j=0;j<itemCount;j++){

      items.push({sku:p.sku,name:p.name,qty,price:p.price,zone:p.zone,shelf:p.shelf,rack:p.rack,bin:p.bin});

    const total = items.reduce((s,it)=>s+it.qty*it.price,0);
    const statusIdx = Math.floor(Math.random()*ORDER_STATUSES.length);
    const status = ORDER_STATUSES[statusIdx];
    const deadline = new Date(Date.now()+(Math.floor(Math.random()*7)-1)*24*3600000);
    const date = new Date(Date.now()-Math.floor(Math.random()*48)*3600000);
    const picker = statusIdx>=3 && statusIdx<=5 ? EMPLOYEES[2+Math.floor(Math.random()*4)].name : null;

    const excType = hasException ? ['Missing Item','Damaged Item','Insufficient Stock','Delayed Picking','Quality Check Failure'][Math.floor(Math.random()*5)] : 'None';

      warehouse:`WH-0${Math.floor(Math.random()*2)+1}`, status, picker, packer,
      exceptionStatus:excType, createdAt:date

  }
  return orders;
}

const timeAgo = (d) => {
  const diff = Date.now()-new Date(d).getTime();
  const min = Math.floor(diff/60000);
  if(min<1) return 'just now';
  if(min<60) return `${min}m ago`;
  const hr = Math.floor(min/60);
  if(hr<24) return `${hr}h ago`;
  return `${Math.floor(hr/24)}d ago`;
};
const hoursUntil = (d) => { return Math.floor((new Date(d).getTime()-Date.now())/3600000); };

function showToast(type,msg){
  const colors = {success:'bg-emerald-600',error:'bg-red-600',warning:'bg-amber-500',info:'bg-brand-600'};
  const icons = {success:'check-circle',error:'x-circle',warning:'alert-triangle',info:'info'};
  const id = 'toast-'+Date.now();
  const html = `
    <div id="${id}" class="toast-enter ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 min-w-[300px] max-w-md">
      <i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0"></i>
      <span class="text-sm font-medium flex-1">${esc(msg)}</span>
      <button onclick="document.getElementById('${id}').remove()" class="opacity-70 hover:opacity-100"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>`;
  document.getElementById('toast-container').insertAdjacentHTML('beforeend',html);
  lucide.createIcons();
  setTimeout(()=>{ const el=document.getElementById(id); if(el) el.remove(); },4000);
}

function showModal(html){
  document.getElementById('modal-container').innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-[9998] flex items-center justify-center p-4 fade-in" onclick="if(event.target===this)closeModal()">
      <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-auto slide-in">${html}</div>
    </div>`;
  lucide.createIcons();
}
function closeModal(){ document.getElementById('modal-container').innerHTML=''; }

function confirmDialog(title,msg,onConfirm){
  showModal(`
    <div class="p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center">
          <i data-lucide="alert-triangle" class="w-6 h-6 text-amber-600"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800">${esc(title)}</h3>
      </div>
      <p class="text-slate-600 mb-6">${esc(msg)}</p>
      <div class="flex justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium text-sm">Cancel</button>
        <button id="confirm-btn" class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:bg-brand-700 font-medium text-sm">Confirm</button>
      </div>
    </div>`);
  document.getElementById('confirm-btn').onclick = ()=>{ closeModal(); onConfirm(); };
}

// ==================== ENGINE: PRIORITY ====================
function calcPriority(order){
  let score = 0;
  const reasons = [];
  const hrsLeft = hoursUntil(order.deadline);
  if(hrsLeft < 0){ score += 40; reasons.push('Past deadline'); }
  else if(hrsLeft < 4){ score += 35; reasons.push(`Deadline in ${hrsLeft}h`); }
  else if(hrsLeft < 24){ score += 20; reasons.push(`Deadline in ${Math.floor(hrsLeft)}h`); }
  else if(hrsLeft < 72){ score += 10; reasons.push(`Deadline in ${Math.floor(hrsLeft/24)}d`); }

  if(order.customerTier === 'VIP'){ score += 25; reasons.push('VIP customer'); }
  else if(order.customerTier === 'Premium'){ score += 15; reasons.push('Premium customer'); }

  if(order.shipMethod === 'Express' || order.shipMethod === 'Same-Day'){ score += 15; reasons.push(`${order.shipMethod} shipping`); }

  if(order.total > 500){ score += 10; reasons.push('High order value'); }

  if(order.exceptionStatus !== 'None'){ score += 15; reasons.push(`Exception: ${order.exceptionStatus}`); }

  let priority = 'Low';
  if(score >= 70) priority = 'Critical';
  else if(score >= 50) priority = 'High';
  else if(score >= 25) priority = 'Medium';

  return { priority, score, reasons };
}

// ==================== ENGINE: ALLOCATION ====================
function checkAllocationConflict(sku){
  const product = PRODUCTS.find(p=>p.sku===sku);
  if(!product) return null;
  const competing = ORDERS.filter(o=>o.status==='New'||o.status==='Confirmed')
    .filter(o=>o.items.some(it=>it.sku===sku));
  if(competing.length === 0) return null;
  const totalDemand = competing.reduce((s,o)=>s+(o.items.find(it=>it.sku===sku)?.qty||0),0);
  if(totalDemand <= product.stock) return null;
  competing.forEach(o=>{ o._priority = calcPriority(o); });
  competing.sort((a,b)=>b._priority.score - a._priority.score);
  return { sku, product, competing, available: product.stock, totalDemand, shortfall: totalDemand - product.stock };
}

function resolveAllocation(sku){
  const conflict = checkAllocationConflict(sku);
  if(!conflict) return null;
  let remaining = conflict.available;
  const decisions = [];
  for(const order of conflict.competing){
    const need = order.items.find(it=>it.sku===sku)?.qty || 0;
    const allocated = Math.min(need, remaining);
    remaining -= allocated;
    decisions.push({
      orderId: order.id, priority: order._priority.priority, score: order._priority.score,
      requested: need, allocated, remaining: need - allocated,
      fullyAllocated: allocated === need, customer: order.customer, customerTier: order.customerTier,
      reasons: order._priority.reasons
    });
  }
  return { ...conflict, decisions, recommendation: decisions[0].allocated > 0 ?
    `Allocate ${decisions[0].allocated} units to ${decisions[0].orderId} (${decisions[0].priority} priority — ${decisions[0].reasons.join(', ')})` : 'No stock available' };
}

// ==================== ENGINE: LOW STOCK ====================
function detectLowStock(){
  return PRODUCTS.filter(p=>p.stock <= p.reorderLevel).map(p=>{
    const daysRemaining = p.stock > 0 ? (p.stock / p.dailyDemand).toFixed(1) : 0;
    let risk = 'Low';
    if(p.stock === 0) risk = 'Critical';
    else if(parseFloat(daysRemaining) < 2) risk = 'High';
    else if(parseFloat(daysRemaining) < 5) risk = 'Medium';
    return { ...p, daysRemaining, risk };
  }).sort((a,b)=>parseFloat(a.daysRemaining)-parseFloat(b.daysRemaining));
}

// ==================== ENGINE: BOTTLENECKS ====================
function detectBottlenecks(){
  const bottlenecks = [];
  const pickingOrders = ORDERS.filter(o=>o.status==='Picking');
  const packingOrders = ORDERS.filter(o=>o.status==='Packing');
  const qcOrders = ORDERS.filter(o=>o.status==='Quality Check');
  const readyOrders = ORDERS.filter(o=>o.status==='Ready for Dispatch');
  if(packingOrders.length > 4) bottlenecks.push({stage:'Packing',count:packingOrders.length,avgTime:'34min',expected:'20min',deviation:'+70%',impact:'Orders delayed in packing queue',recommendation:'Assign 2 additional packers during peak hours. Rebalance workload across stations.'});
  if(pickingOrders.length > 3) bottlenecks.push({stage:'Picking',count:pickingOrders.length,avgTime:'18min',expected:'12min',deviation:'+50%',impact:'Picking queue backing up',recommendation:'Reassign pickers from low-activity zones. Optimize picking routes for Zone B.'});
  if(qcOrders.length > 2) bottlenecks.push({stage:'Quality Check',count:qcOrders.length,avgTime:'8min',expected:'5min',deviation:'+60%',impact:'QC bottleneck before dispatch',recommendation:'Add temporary QC station. Streamline checklist for standard orders.'});
  if(readyOrders.length > 3) bottlenecks.push({stage:'Dispatch',count:readyOrders.length,avgTime:'45min',expected:'25min',deviation:'+80%',impact:'Dispatch queue backing up',recommendation:'Contact alternate carrier for priority pickup. Expedite dispatch for critical orders.'});
  // Zone-based bottleneck
  const zoneB = ORDERS.filter(o=>o.status==='Picking' && o.items.some(it=>it.zone==='B'));
  if(zoneB.length > 2) bottlenecks.push({stage:'Zone B Picking',count:zoneB.length,avgTime:'22min',expected:'12min',deviation:'+83%',impact:'Zone B has 27% slower picking performance',recommendation:'Rebalance picking tasks between Zone A and Zone B. Assign additional picker to Zone B.'});
  return bottlenecks;
}

// ==================== ENGINE: PICKING ROUTE ====================
function optimizeRoute(order){
  const items = order.items.map(it=>({sku:it.sku,name:it.name,qty:it.qty,zone:it.zone,shelf:it.shelf,rack:it.rack,bin:it.bin}));
  items.sort((a,b)=>{
    if(a.zone !== b.zone) return a.zone.localeCompare(b.zone);
    if(a.shelf !== b.shelf) return a.shelf - b.shelf;
    if(a.rack !== b.rack) return a.rack - b.rack;
    return a.bin - b.bin;
  });
  const distance = items.length * 15 + Math.floor(Math.random()*30);
  const time = Math.ceil(distance * 0.8 + items.length * 2);
  const efficiency = Math.max(60, 95 - items.length * 3);
  return { route: items, distance, time, efficiency, locations: items.length };
}

// ==================== ENGINE: RECOMMENDATIONS ====================

  const recs = [];

  const lowStock = detectLowStock();
  lowStock.slice(0,3).forEach(p=>{
    recs.push({

      impact:`Prevents stockout and maintains fulfillment rate for ~${Math.floor(p.reorderQty/p.dailyDemand)} days`,
      action:'Place Reorder', actionType:'reorder', actionData:{sku:p.sku,qty:p.reorderQty,supplier:p.supplier}
    });
  });
  // Allocation conflict rec
  const conflict = resolveAllocation('SKU-103');
  if(conflict){
    recs.push({

      problem:`Stock conflict on SKU-103 — ${conflict.totalDemand} units demanded, only ${conflict.available} available`,

      decision:`Allocate ${conflict.decisions[0].allocated} units to ${conflict.decisions[0].orderId} (Critical priority). Mark as Partially Allocated.`,
      impact:`Critical VIP order partially fulfilled. Exception created. Reorder triggered automatically.`,
      action:'Apply Allocation', actionType:'allocate', actionData:{conflict}
    });
  }
  // Bottleneck recs
  const bottlenecks = detectBottlenecks();
  bottlenecks.slice(0,2).forEach(b=>{
    recs.push({
      id:'rec-bn-'+b.stage, type:'Staffing', icon:'users', color:'purple',
      problem:`${b.stage} bottleneck detected — ${b.deviation} slower than average`,
      data:`Current queue: ${b.count} orders | Avg time: ${b.avgTime} | Expected: ${b.expected}`,
      decision:b.recommendation,
      impact:`Reduces average processing time by ~30%. Prevents cascade delays.`,
      action:'View Analytics', actionType:'navigate', actionData:{view:'analytics'}
    });
  });
  // Picking optimization rec
  recs.push({
    id:'rec-pick-1', type:'Picking', icon:'route', color:'blue',
    problem:'Picking routes can be optimized for Zone A orders',
    data:'4 orders in Zone A with unoptimized picking sequences | Avg travel: 85m per order',
    decision:'Process Zone A orders in shelf sequence (A1→A5→A8→A9) to minimize travel',
    impact:'Reduces average picking time by 35%. Saves ~12 minutes per picker per shift.',
    action:'View Picking', actionType:'navigate', actionData:{view:'picking'}
  });
  // Exception rec
  const openExc = EXCEPTIONS.filter(e=>e.status==='Open');
  if(openExc.length > 0){
    recs.push({
      id:'rec-exc-1', type:'Exception', icon:'alert-circle', color:'red',
      problem:`${openExc.length} open exceptions need immediate attention`,
      data:`${openExc.filter(e=>e.severity==='Critical').length} Critical | ${openExc.filter(e=>e.severity==='High').length} High severity`,
      decision:'Prioritize Critical exceptions first. Search alternate locations for missing items.',
      impact:`Prevents order delays and customer dissatisfaction. Resolves bottleneck in exception queue.`,
      action:'View Exceptions', actionType:'navigate', actionData:{view:'exceptions'}
    });
  }
  return recs;
}

function renderFeedItems(){
  const colors = {critical:'border-l-red-500 bg-red-50',warning:'border-l-amber-500 bg-amber-50',info:'border-l-blue-500 bg-blue-50',success:'border-l-emerald-500 bg-emerald-50'};
  return state.feed.slice(0,15).map(e=>`
    <div class="flex items-start gap-3 p-2.5 rounded-lg border-l-2 ${colors[e.type]||colors.info}">
      <p class="text-sm text-slate-700 flex-1">${esc(e.message)}</p>
      <span class="text-xs text-slate-400 whitespace-nowrap">${timeAgo(e.time)}</span>
    </div>
  `).join('');
}

function renderFeed(){
  const container = document.getElementById('feed-container');
  if(container) container.innerHTML = renderFeedItems();
}

                    <p class="text-xs text-slate-400 font-mono">${it.sku} · Zone ${it.zone} S${it.shelf}/R${it.rack}/B${it.bin}</p>
                  </div>
                  <div class="text-right">
                    <p class="text-sm font-bold">${it.qty} × ${fmtCur(it.price)}</p>
                    <p class="text-xs text-slate-500">${fmtCur(it.qty*it.price)}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          ${order.exceptionStatus!=='None'?`<div class="bg-red-50 border border-red-200 rounded-lg p-3"><p class="text-sm text-red-700"><i data-lucide="alert-triangle" class="w-4 h-4 inline"></i> Exception: ${order.exceptionStatus}</p></div>`:''}
        </div>
      </div>
    `);
  },
  applyAllocation(sku){
    const result = resolveAllocation(sku);
    if(!result) return;
    result.decisions.forEach(d=>{
      const order = ORDERS.find(o=>o.id===d.orderId);
      if(order){
        order.status = d.fullyAllocated ? 'Allocated' : 'Partially Allocated';
        const product = PRODUCTS.find(p=>p.sku===sku);
        if(product){
          product.stock -= d.allocated;
          product.reserved += d.allocated;
        }
      }
    });
    showToast('success',`Allocation applied: ${result.decisions[0].allocated} units to ${result.decisions[0].orderId}`);
    addActivityLog(state.user.name,`allocated ${result.decisions[0].allocated}/${result.decisions[0].requested} units of ${sku} to`,result.decisions[0].orderId,'New','Partially Allocated');
    addFeedEvent2('success',`${result.decisions[0].allocated} units of ${sku} allocated to ${result.decisions[0].orderId}`);
    render();
  },
  overrideAllocation(sku){
    showModal(`
      <div class="p-6">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Override Allocation Decision</h3>
        <p class="text-sm text-slate-600 mb-4">Select how to distribute available stock:</p>
        <div class="space-y-3">
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="radio" name="override" value="critical" checked class="w-4 h-4 text-brand-600"/>
            <div><p class="text-sm font-medium">Allocate to Critical (ORD-1001)</p><p class="text-xs text-slate-500">7 units to ORD-1001, 0 to ORD-1002</p></div>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="radio" name="override" value="split" class="w-4 h-4 text-brand-600"/>
            <div><p class="text-sm font-medium">Split Equally</p><p class="text-xs text-slate-500">3 units to ORD-1001, 4 to ORD-1002</p></div>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="radio" name="override" value="medium" class="w-4 h-4 text-brand-600"/>
            <div><p class="text-sm font-medium">Allocate to Medium (ORD-1002)</p><p class="text-xs text-slate-500">5 units to ORD-1002, 2 to ORD-1001</p></div>
          </label>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm">Cancel</button>
          <button onclick="closeModal();showToast('info','Override applied');render()" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-semibold">Apply Override</button>
        </div>
      </div>
    `);
  },
  triggerReorder(sku,qty){
    const product = PRODUCTS.find(p=>p.sku===sku);
    if(!product) return;
    showToast('success',`Reorder placed: ${qty} units of ${product.name} from ${product.supplier}`);
    addActivityLog(state.user.name,'placed reorder for',`${sku} (${qty} units)`,'-','Ordered');
    addFeedEvent2('info',`Reorder placed: ${qty} units of ${sku} from ${product.supplier}`);
    state.notifications.unshift({
      id:Date.now(),type:'info',title:'Reorder Placed',
      message:`${qty} units of ${product.name} (${sku}) ordered from ${product.supplier}.`,
      time:new Date(),read:false
    });
    render();
  },
  startPicking(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Picking';
    order.picker = state.user.name;
    showToast('info',`Picking started for ${orderId}`);
    addActivityLog(state.user.name,'started picking',orderId,'Confirmed','Picking');
    addFeedEvent2('info',`Picker ${state.user.name} started picking ${orderId}`);
    render();
  },
  completePicking(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Picked';
    showToast('success',`Picking completed for ${orderId}`);
    addActivityLog(state.user.name,'completed picking',orderId,'Picking','Picked');
    addFeedEvent2('success',`Picking completed for ${orderId}`);
    render();
  },
  assignPicker(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.picker = state.user.name;
    order.status = 'Picking';
    showToast('info',`Assigned to ${order.picker}`);
    render();
  },
  startPacking(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Packing';
    order.packer = state.user.name;
    showToast('info',`Packing started for ${orderId}`);
    addActivityLog(state.user.name,'started packing',orderId,'Picked','Packing');
    render();
  },
  completePacking(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Quality Check';
    showToast('success',`Packing completed for ${orderId}`);
    addActivityLog(state.user.name,'completed packing',orderId,'Packing','Quality Check');
    render();
  },
  passQC(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Ready for Dispatch';
    showToast('success',`${orderId} passed quality check`);
    addActivityLog(state.user.name,'passed QC for',orderId,'Quality Check','Ready for Dispatch');
    addFeedEvent2('success',`Quality check passed for ${orderId}`);
    render();
  },
  failQC(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Quality Check';
    order.exceptionStatus = 'Quality Check Failure';
    EXCEPTIONS.unshift({
      id:`EX-${100+EXCEPTIONS.length+1}`,type:'Quality Check Failure',order:orderId,
      sku:'Multiple',severity:'Critical',status:'Open',created:new Date(),
      assigned:state.user.name,
      recommendation:'Re-run quality check. If failed again, create replacement order and notify customer of delay.'
    });
    showToast('error',`${orderId} failed quality check — exception created`);
    addActivityLog(state.user.name,'failed QC for',orderId,'Quality Check','Exception');
    addFeedEvent2('critical',`Quality check FAILED for ${orderId} — exception created`);
    state.notifications.unshift({
      id:Date.now(),type:'critical',title:'Quality Check Failed',
      message:`${orderId} failed quality check. Exception created.`,
      time:new Date(),read:false
    });
    render();
  },
  dispatch(orderId){
    const order = ORDERS.find(o=>o.id===orderId);
    if(!order) return;
    order.status = 'Dispatched';
    showToast('success',`${orderId} dispatched successfully`);
    addActivityLog(state.user.name,'dispatched',orderId,'Ready for Dispatch','Dispatched');
    addFeedEvent2('success',`Order ${orderId} dispatched`);
    render();
  },
  resolveException(exId){
    const exc = EXCEPTIONS.find(e=>e.id===exId);
    if(!exc) return;
    exc.status = 'Resolved';
    showToast('success',`Exception ${exId} resolved`);
    addActivityLog(state.user.name,'resolved exception',exId,'Open','Resolved');
    render();
  },
  investigateException(exId){
    const exc = EXCEPTIONS.find(e=>e.id===exId);
    if(!exc) return;
    exc.status = 'Investigating';
    showToast('info',`Investigating ${exId}`);
    render();
  },
  reportIssue(orderId,stage){
    showModal(`
      <div class="p-6">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Report Issue — ${orderId}</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Issue Type</label>
            <select id="issue-type" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
              <option value="missing">Missing Item</option>
              <option value="damaged">Damaged Item</option>
              <option value="wrong">Wrong Item</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">SKU</label>
            <input type="text" id="issue-sku" placeholder="SKU-XXX" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
            <textarea id="issue-desc" rows="3" placeholder="Describe the issue..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Severity</label>
            <select id="issue-sev" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
              <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm">Cancel</button>
          <button onclick="actions.submitIssue('${orderId}')" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-semibold">Submit Report</button>
        </div>
      </div>
    `);
  },
  submitIssue(orderId){
    const type = document.getElementById('issue-type').value;
    const sku = document.getElementById('issue-sku').value || 'SKU-XXX';
    const desc = document.getElementById('issue-desc').value || 'No description';
    const sev = document.getElementById('issue-sev').value;
    const excType = type==='missing'?'Missing Item':type==='damaged'?'Damaged Item':'Wrong Item';
    EXCEPTIONS.unshift({
      id:`EX-${100+EXCEPTIONS.length+1}`,type:excType,order:orderId,sku,severity:sev,
      status:'Open',created:new Date(),assigned:state.user.name,
      recommendation: type==='missing'?'Search alternate warehouse location. Check reserved inventory. Reallocate from safety stock.' : 'Replace item from available stock. File damage report with supplier.'
    });
    const order = ORDERS.find(o=>o.id===orderId);
    if(order) order.exceptionStatus = excType;
    closeModal();
    showToast('warning',`Issue reported — exception created for ${orderId}`);
    addActivityLog(state.user.name,'reported '+excType+' for',orderId,'-','Exception');
    addFeedEvent2('warning',`${excType} reported for ${orderId} (${sku})`);
    state.notifications.unshift({
      id:Date.now(),type:'warning',title:excType,
      message:`${excType} reported for ${orderId} — ${sku}. Exception created.`,
      time:new Date(),read:false
    });
    render();
  },
  applyRecommendation(recId){
    const recs = generateRecommendations();
    const rec = recs.find(r=>r.id===recId);
    if(!rec) return;
    if(rec.actionType==='reorder'){
      actions.triggerReorder(rec.actionData.sku, rec.actionData.qty);
    } else if(rec.actionType==='allocate'){
      actions.applyAllocation('SKU-103');
    } else if(rec.actionType==='navigate'){
      navigate(rec.actionData.view);
    }
  },
  runDemoScenario(){
    actions.applyAllocation('SKU-103');
    setTimeout(()=>{
      actions.triggerReorder('SKU-103',100);
      showToast('success','Demo scenario executed — check Allocation page for results');
    },500);
  },
  markRead(id){
    const n = state.notifications.find(n=>n.id===id);
    if(n) n.read = true;
    render();
  },
  markAllRead(){
    state.notifications.forEach(n=>n.read=true);
    render();
  },
  selectPickingTask(orderId){
    actions.viewOrder(orderId);
  },
  showNewOrderModal(){
    showModal(`
      <div class="p-6">
        <h3 class="text-lg font-bold text-slate-800 mb-4">Create New Order</h3>
        <div class="space-y-3">
          <div><label class="block text-xs font-medium text-slate-500 mb-1">Customer</label>
            <select class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
              ${CUSTOMERS.map(c=>`<option>${c.name} (${c.tier})</option>`).join('')}
            </select>
          </div>
          <div><label class="block text-xs font-medium text-slate-500 mb-1">Product</label>
            <select class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
              ${PRODUCTS.slice(0,20).map(p=>`<option value="${p.sku}">${p.name} (${p.sku}) — ${fmtCur(p.price)}</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs font-medium text-slate-500 mb-1">Quantity</label><input type="number" value="1" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"/></div>
            <div><label class="block text-xs font-medium text-slate-500 mb-1">Shipping</label>
              <select class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                ${SHIP_METHODS.map(s=>`<option>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
          <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm">Cancel</button>
          <button onclick="closeModal();showToast('success','Order created successfully');render()" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-semibold">Create Order</button>
        </div>
      </div>
    `);
  }
};

function addFeedEvent2(type,message){
  state.feed.unshift({type,message,time:new Date()});
  if(state.feed.length>20) state.feed.pop();
  if(state.view==='dashboard') renderFeed();
}

// ==================== SEARCH ====================
function handleSearch(){
  if(state.searchQuery.length>0 && state.view!=='orders' && state.view!=='inventory'){
    navigate('orders');
  } else {
    render();
  }
}

// ==================== CHARTS ====================
function renderCharts(){
  destroyCharts();
  if(state.view==='dashboard'){
    // Order status doughnut
    const statusCtx = document.getElementById('chartOrderStatus');
    if(statusCtx){
      const statusCounts = {};
      ORDERS.forEach(o=>{ statusCounts[o.status]=(statusCounts[o.status]||0)+1; });
      charts.status = new Chart(statusCtx,{
        type:'doughnut',
        data:{labels:Object.keys(statusCounts),datasets:[{data:Object.values(statusCounts),backgroundColor:['#6366f1','#3b82f6','#8b5cf6','#a855f7','#f59e0b','#10b981','#ef4444','#06b6d4','#84cc16','#f97316','#14b8a6'],borderWidth:0}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{boxWidth:10,padding:8,font:{size:10}}}}}
      });
    }
    // Priority bar
    const priCtx = document.getElementById('chartPriority');
    if(priCtx){
      const priCounts = {Critical:0,High:0,Medium:0,Low:0};
      ORDERS.forEach(o=>{ priCounts[calcPriority(o).priority]++; });
      charts.priority = new Chart(priCtx,{
        type:'bar',
        data:{labels:['Critical','High','Medium','Low'],datasets:[{data:[priCounts.Critical,priCounts.High,priCounts.Medium,priCounts.Low],backgroundColor:['#ef4444','#f59e0b','#3b82f6','#94a3b8'],borderWidth:0,borderRadius:6}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{display:false},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:11}}}}}
      });
    }
    // Fulfillment line
    const fulCtx = document.getElementById('chartFulfillment');
    if(fulCtx){
      const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      charts.ful = new Chart(fulCtx,{
        type:'line',
        data:{labels,datasets:[
          {label:'Fulfilled',data:[12,18,15,22,28,25,30],borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',fill:true,tension:.4},
          {label:'Pending',data:[8,5,10,6,4,7,3],borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,.1)',fill:true,tension:.4}
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}
      });
    }
  }
  if(state.view==='analytics'){
    const ptCtx = document.getElementById('chartProcessingTime');
    if(ptCtx){
      charts.pt = new Chart(ptCtx,{
        type:'bar',
        data:{labels:['Picking','Packing','QC','Dispatch'],datasets:[{label:'Avg Time (min)',data:[12,8,5,25],backgroundColor:['#8b5cf6','#6366f1','#f59e0b','#06b6d4'],borderRadius:6},{label:'Expected (min)',data:[10,6,4,20],backgroundColor:['#c4b5fd','#a5b4fc','#fcd34d','#67e8f9'],borderRadius:6}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10}}}},scales:{y:{beginAtZero:true,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:11}}}}}
      });
    }
    const perfCtx = document.getElementById('chartPerformance');
    if(perfCtx){
      charts.perf = new Chart(perfCtx,{
        type:'line',
        data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[
          {label:'Fulfillment %',data:[82,87,85,90,92,88,94],borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',fill:true,tension:.4},
          {label:'On-time %',data:[78,85,88,86,91,89,93],borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.1)',fill:true,tension:.4}
        ]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:10}}}},scales:{y:{beginAtZero:false,min:70,max:100,grid:{color:'#f1f5f9'},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}
      });
    }
  }
}

// ==================== LIVE FEED ====================
let feedInterval = null;
function startLiveFeed(){
  if(feedInterval) clearInterval(feedInterval);
  feedInterval = setInterval(addFeedEvent, 15000);
}

// ==================== ROUTER ====================
function navigate(view){
  state.view = view;
  state.sidebarOpen = window.innerWidth <= 1024 ? false : state.sidebarOpen;
  render();
}

// ==================== RENDER ====================
function render(){
  destroyCharts();
  if(!state.user){
    document.getElementById('app').innerHTML = renderLogin();
    lucide.createIcons();
    return;
  }

  const views = {
    dashboard: renderDashboard,
    orders: renderOrders,
    inventory: renderInventory,
    allocation: renderAllocation,
    picking: renderPicking,
    packing: renderPacking,
    qualityCheck: renderQualityCheck,
    dispatch: renderDispatch,
    exceptions: renderExceptions,
    analytics: renderAnalytics,
    smartDecisions: renderSmartDecisions,
    notifications: renderNotifications,
    settings: renderSettings
  };

  const viewFn = views[state.view] || renderDashboard;
  document.getElementById('app').innerHTML = `
    <div class="flex min-h-screen bg-slate-50">
      ${renderSidebar()}
      <div class="flex-1 min-w-0 flex flex-col">
        ${renderTopbar()}
        <main class="flex-1 p-4 lg:p-6 overflow-x-hidden">
          ${viewFn()}
        </main>
      </div>
    </div>
  `;
  lucide.createIcons();
  setTimeout(renderCharts, 50);
}

// ==================== INIT ====================
render();
</script>
</body>
</html>
